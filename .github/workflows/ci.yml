name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and lint extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run syntax, manifest, and automated tests
        run: npm run check

      - name: Prepare and verify package sources
        run: npm run verify:packages

      - name: Lint Firefox package
        run: npm run lint:firefox

      - name: Smoke-test packaged Chrome extension
        run: npm run smoke:chrome
